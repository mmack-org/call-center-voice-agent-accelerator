name: voice-live-agent
metadata:
  template: voice-live-agent@0.1.0
requiredVersions:
  azd: ">=1.14.0"
infra:
  provider: bicep
  path: infra
services:
  app:
    project: server
    host: containerapp
    language: python
    docker:
      path: Dockerfile
      remoteBuild: true
      buildArgs:
        - TELEPHONY=${TELEPHONY_PROVIDER}
hooks:
  preprovision:
    shell: pwsh
    run: ./hooks/preprovision.ps1
    interactive: true
    continueOnError: false
  postprovision:
    - name: deploy-fabric
      shell: pwsh
      run: ./hooks/deploy-fabric.ps1
      interactive: true
      continueOnError: false
    - name: deploy-aisearch-config
      shell: pwsh
      run: ./hooks/deploy-aisearch-iq-config.ps1
      interactive: true
      continueOnError: false
    - name: configure-foundry-agent
      shell: pwsh
      run: ./hooks/postprovision.ps1
      continueOnError: false
  predeploy:
    shell: pwsh
    run: ./hooks/predeploy.ps1
    continueOnError: false
  postdeploy:
    shell: pwsh
    run: ./hooks/postdeploy.ps1
    interactive: true
    continueOnError: true
pipeline:
  variables:
    - AZURE_LOCATION
    - AZURE_RESOURCE_GROUP
    - AZURE_CONTAINER_REGISTRY_ENDPOINT
    - AZURE_CONTAINER_APP_NAME
    - SERVICE_API_ENDPOINTS
    - AZURE_VOICE_LIVE_ENDPOINT
    - AZURE_VOICE_LIVE_MODEL
    - AZURE_VOICE_LIVE_VOICE
    - AZURE_VOICE_LIVE_DEPLOYMENT_NAME
    - AZURE_VOICE_LIVE_MODEL_NAME
    - AZURE_VOICE_LIVE_MODEL_VERSION
    - AZURE_VOICE_LIVE_MODEL_SKU
    - AZURE_VOICE_LIVE_MODEL_CAPACITY
    - AZURE_AI_FOUNDRY_PROJECT_ID
    - AZURE_AI_FOUNDRY_PROJECT_NAME
    - AZURE_AI_FOUNDRY_PROJECT_ENDPOINT
    - AZURE_AI_FOUNDRY_CONNECTION_NAME
    - ENABLE_FOUNDRY_IQ
    - AZURE_AI_SEARCH_SERVICE_NAME
    - AZURE_AI_SEARCH_ENDPOINT
    - AZURE_SEARCH_ENDPOINT
    - AZURE_FOUNDRY_ENDPOINT
    - AZURE_STORAGE_ACCOUNT_NAME
    - AZURE_STORAGE_CONTAINER_NAME
    - AZURE_FOUNDRY_IQ_KNOWLEDGE_BASE_NAME
    - AZURE_FOUNDRY_IQ_CONNECTION_NAME
    - AZURE_FOUNDRY_IQ_CHAT_MODEL_NAME
    - AZURE_FOUNDRY_IQ_CHAT_MODEL_DEPLOYMENT
    - AZURE_FOUNDRY_IQ_CHAT_MODEL_CAPACITY
    - AZURE_FOUNDRY_IQ_EMBEDDING_MODEL_NAME
    - AZURE_FOUNDRY_IQ_EMBEDDING_MODEL_DEPLOYMENT
    - AZURE_FOUNDRY_IQ_EMBEDDING_MODEL_CAPACITY
    - AZURE_AI_FOUNDRY_AGENT_ID
    - AZURE_AI_AGENT_MODEL_NAME
    - AZURE_AI_AGENT_MODEL_VERSION
    - AZURE_AI_AGENT_MODEL_DEPLOYMENT
    - AZURE_USER_ASSIGNED_IDENTITY_PRINCIPAL_ID
    - FABRIC_READ_IDENTITY_PRINCIPAL_ID
    - FABRIC_WRITE_IDENTITY_PRINCIPAL_ID
    - FABRIC_CAPACITY_ID
    - FABRIC_CAPACITY_NAME
    - FABRIC_WORKSPACE_NAME
    - FABRIC_WORKSPACE_ID
    - FABRIC_LAKEHOUSE_NAME
    - FABRIC_LAKEHOUSE_ID
    - FABRIC_INGESTION_NOTEBOOK_ID
    - FABRIC_DATA_AGENT_NAME
    - FABRIC_DATA_AGENT_ID
    - TWILIO_ACCOUNT_SID
    - INFOBIP_API_BASE_URL
    - SINCH_APPLICATION_KEY
    - BANDWIDTH_ACCOUNT_ID
    - BANDWIDTH_CLIENT_ID
    - BANDWIDTH_APPLICATION_ID
  secrets:
    - TWILIO_AUTH_TOKEN
    - INFOBIP_API_KEY
    - SINCH_APPLICATION_SECRET
    - BANDWIDTH_CLIENT_SECRET